name: Deploy Docs to GitHub Pages

# =============================================================================
# 触发条件：
#   1. 推送到 main / master 分支（且影响到文档相关路径）
#   2. 手动从 Actions 面板点击 "Run workflow"
# =============================================================================
on:
  push:
    branches:
      - main
      - master
    paths:
      - "docs/**"
      - "videos/**"
      - "README.md"
      - "mkdocs.yml"
      - "requirements.docs.txt"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

# 仅允许一个并发的 Pages 部署，避免排队冲突
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write
  # 注意：GitHub Actions GITHUB_TOKEN 的 permissions 合法作用域里**没有**
  # "administration"，强行写入会被 GitHub 拒绝并报错：
  #   Invalid workflow file: Unexpected value 'administration'
  # 因此 pages 启用与 source 的选择必须由仓库管理员手工在 Settings 完成
  # （见 docs/GitHub_Pages部署说明.md §三）。

jobs:
  # ---------------------------------------------------------------------------
  # 构建阶段：使用 MkDocs 生成静态站点
  # ---------------------------------------------------------------------------
  build:
    name: Build MkDocs site
    runs-on: ubuntu-latest
    # 关于 "自动启用 Pages" 的说明写在下方 actions/configure-pages@v6 步骤里，
    # 只跟仓库是否配置了名为 DOCS_PAGES_ADMIN_TOKEN 的 secret 有关。
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 将根目录 README.md 作为首页拷贝到 docs/ 下（mkdocs.yml 中引用了 docs/README.md）
      - name: Prepare docs assets (copy README + videos into docs dir)
        shell: bash
        run: |
          if [ -f README.md ] && [ ! -f docs/README.md ]; then
            cp README.md docs/README.md
            # 将 README.md 中指向 videos/xxx 的相对路径改写为 ../videos/xxx（保持和原始仓库一致）
            # （如果希望 README 中的图片可显示，也可以把 videos/ 目录整个软链接到 docs/videos/）
          fi
          # 创建软链接，使 docs/ 可以直接引用 videos/ 目录下的媒体资源
          if [ -d videos ] && [ ! -e docs/videos ]; then
            ln -s "$(pwd)/videos" docs/videos || cp -r videos docs/videos
          fi
          # MkDocs 要求额外的 js / css 放在 docs_dir 下
          mkdir -p docs/javascripts docs/stylesheets
          if [ ! -f docs/javascripts/katex.js ]; then
            cat > docs/javascripts/katex.js <<'KATEX_EOF'
          document$.subscribe(() => {
            renderMathInElement(document.body, {
              delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$',  right: '$',  display: false},
                {left: '\\[', right: '\\]', display: true},
                {left: '\\(', right: '\\)', display: false}
              ],
              throwOnError: false,
              strict: false,
              trust: true
            });
          });
          KATEX_EOF
          fi
          if [ ! -f docs/stylesheets/extra.css ]; then
            cat > docs/stylesheets/extra.css <<'CSS_EOF'
          /* 修正 KaTeX 与 Material 主题字体的垂直对齐 */
          .katex { font-size: 1.05em; }
          .md-typeset .katex-display {
            margin: 1em 0;
            overflow-x: auto;
            overflow-y: hidden;
          }
          /* 深色模式下 KaTeX 符号颜色继承主题 */
          .md-typeset :is(.katex,.katex-display) .mord,
          .md-typeset :is(.katex,.katex-display) .mop,
          .md-typeset :is(.katex,.katex-display) .mbin,
          .md-typeset :is(.katex,.katex-display) .mrel,
          .md-typeset :is(.katex,.katex-display) .mpunct,
          .md-typeset :is(.katex,.katex-display) .mopen,
          .md-typeset :is(.katex,.katex-display) .mclose,
          .md-typeset :is(.katex,.katex-display) .minner { color: inherit; }
          CSS_EOF
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          # 显式指定供 setup-python 计算缓存 key 的依赖文件；
          # 这里必须指向一个真实存在于仓库中的 requirements 风格文件，否则
          # setup-python 会因为找不到 **/requirements.txt / **/pyproject.toml 而失败：
          #   Error: No file in <repo> matched to [**/requirements.txt or **/pyproject.toml]
          cache-dependency-path: requirements.docs.txt

      - name: Install MkDocs + Material theme and plugins
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --requirement requirements.docs.txt

      - name: Configure Pages
        id: pages
        # 使用官方针对 Node 24 发布的最新稳定大版本 v4。
        #
        # token / enablement 说明：
        #   - 如果仓库管理员在 Secrets 里配置了 DOCS_PAGES_ADMIN_TOKEN
        #     （GitHub App / classic PAT，含 pages:write + 仓库设置级权限），
        #     就用它调用 configure-pages 并开启 enablement:true，workflow 会
        #     自动把 Settings → Pages 的 Source 切为 "GitHub Actions"，从而
        #     避免 "Get Pages site failed … Not Found"。
        #   - 没配 DOCS_PAGES_ADMIN_TOKEN 时，退回到默认 GITHUB_TOKEN，
        #     但它没有 administration 作用域，所以 enablement 也置为 false；
        #     这种情况下需要先手动去 Settings → Pages 选 "GitHub Actions"。
        uses: actions/configure-pages@v4
        with:
          token: ${{ secrets.DOCS_PAGES_ADMIN_TOKEN || github.token }}
          enablement: ${{ secrets.DOCS_PAGES_ADMIN_TOKEN != '' }}

      - name: Build MkDocs site
        env:
          # 让站点的 baseurl/siteroot 与 GitHub Pages 实际部署路径匹配
          MKDOCS_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail

          # 注意：`mkdocs build` 命令行本身 **没有** `--site-url` 这个选项，
          # 直接 `--site-url https://...` 会被 mkdocs 拒绝：
          #   Error: No such option '--site-url'. Did you mean '--site-dir'?
          # 正确做法是把 site_url 写进 mkdocs.yml。为了不污染仓库里的原始配置，
          # 这里用一个原地覆盖的方式：仅当 mkdocs.yml 中的 site_url 为空 / 留空时，
          # 才注入 Pages 给出的真实 base_url。
          if [ -n "${MKDOCS_SITE_URL}" ]; then
            python - <<'PY'
            import os, re
            url = os.environ["MKDOCS_SITE_URL"].rstrip("/") + "/"
            path = "mkdocs.yml"
            with open(path, "r", encoding="utf-8") as f:
                text = f.read()
            # 匹配行首的 `site_url:`（允许前后空白）+ 之后的空值。
            # MkDocs 对同一 key 的重复定义会以后者为准，
            # 因此这里优先替换已有的空行，否则直接追加。
            pattern = re.compile(r'^site_url\s*:\s*(["\']?)\s*\1\s*$', re.MULTILINE)
            replacement = f'site_url: "{url}"'
            new_text, n = pattern.subn(replacement, text, count=1)
            if n == 0:
                pattern2 = re.compile(r'^site_url\s*:\s*.*$', re.MULTILINE)
                new_text2, n2 = pattern2.subn(replacement, text, count=1)
                if n2 == 0:
                    new_text = replacement + "\n" + text
                else:
                    new_text = new_text2
            with open(path, "w", encoding="utf-8") as f:
                f.write(new_text)
            print(f"Injected site_url into {path}: {url}")
            PY
          fi

          mkdocs build --strict

      - name: Add .nojekyll
        run: |
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # ---------------------------------------------------------------------------
  # 部署阶段：将构建产物发布到 GitHub Pages
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # 使用官方最新大版本（兼容 Node 24）。
        uses: actions/deploy-pages@v4
