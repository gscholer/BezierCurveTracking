<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360">
  <rect width="600" height="360" fill="#ffffff" rx="8"/>

  <!-- Allowed sector -->
  <path d="M 160 220 L 233.72 168.38 A 90 90 0 0 0 233.72 271.62 Z" fill="rgba(34,197,94,0.15)" stroke="none"/>

  <!-- Boundary lines -->
  <line x1="160" y1="220" x2="274.68" y2="139.70"
        stroke="#16a34a" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>
  <line x1="160" y1="220" x2="274.68" y2="300.30"
        stroke="#16a34a" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>

  <!-- h arrow -->
  <line x1="160" y1="220" x2="300.00" y2="220.00"
        stroke="#1f2937" stroke-width="2.5"/>
  <polygon points="300.0,220.0 290.94,215.77 290.94,224.23" fill="#1f2937"/>
  <text x="312.0" y="225.0" fill="#1f2937" font-size="14" font-weight="600">h（当前航向）</text>

  <!-- v arrow (out of bounds) -->
  <line x1="160" y1="220" x2="219.17" y2="93.12"
        stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="219.16655664369793,93.116909814869 211.51,99.54 219.17,103.12" fill="#dc2626"/>
  <text x="227.16655664369793" y="85.116909814869" fill="#dc2626" font-size="13" font-weight="600">v（原始追逐方向，超界）</text>

  <!-- v_clamped arrow -->
  <line x1="160" y1="220" x2="274.68" y2="300.30"
        stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="274.6812862004589,300.30070108914646 269.68,291.64 264.83,298.56" fill="#16a34a"/>
  <text x="282.6812862004589" y="318.30070108914646" fill="#16a34a" font-size="13" font-weight="600">v_clamped（约束后的方向）</text>

  <!-- theta_max arc -->
  <path d="M 209.15 185.59 A 60 60 0 0 0 220.00 220.00" fill="none" stroke="#16a34a" stroke-width="1.5"/>
  <text x="201.96" y="210.77"
        fill="#16a34a" font-size="12">θ_max</text>

  <!-- theta_diff arc -->
  <path d="M 270.00 220.00 A 110 110 0 0 1 206.49 120.31" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="258.61" y="141.56"
        fill="#dc2626" font-size="12">θ_diff (&gt; θ_max)</text>

  <!-- Origin -->
  <circle cx="160" cy="220" r="3" fill="#1f2937"/>
  <text x="152" y="238" fill="#4b5563" font-size="12">O</text>

  <!-- Legend -->
  <text x="284.6812862004589" y="304.30070108914646"
        fill="#16a34a" font-size="12" opacity="0.9">← 允许边界 (θ_max)</text>
</svg>
